<header class="site-header">
  <div class="shell header-inner">
    <a class="site-name" rel="author" href="{{ '/' | relative_url }}#top">
      {{ site.title | escape }}
    </a>

    <div class="header-actions">
      <nav aria-label="Primary navigation">
        <ul class="site-nav">
          <li>
            <a href="{{ '/' | relative_url }}#research-interests" data-section-link="research-interests">Research interests</a>
          </li>
          <li>
            <a href="{{ '/' | relative_url }}#works" data-section-link="works">Works</a>
          </li>
          <li>
            <a href="{{ '/' | relative_url }}#research-projects" data-section-link="research-projects">Research projects</a>
          </li>
          <li>
            <a href="{{ '/' | relative_url }}#news" data-section-link="news">News</a>
          </li>
          <li>
            <a href="{{ '/' | relative_url }}#education" data-section-link="education">Education</a>
          </li>
          <li>
            <a href="{{ '/' | relative_url }}#hobbies" data-section-link="hobbies">Hobbies</a>
          </li>
        </ul>
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle
        aria-label="Change color appearance" title="Change color appearance">
        <span class="theme-icon" data-theme-icon aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>
