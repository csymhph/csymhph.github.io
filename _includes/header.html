<header class="site-header">
  <div class="shell header-inner">
    <a class="site-name" rel="author" href="{{ '/' | relative_url }}#top">
      {{ site.title | escape }}
    </a>

    <div class="header-actions">
      <nav aria-label="Primary navigation">
        <ul class="site-nav">
          <li>
            <a href="{{ '/' | relative_url }}#works">Works</a>
          </li>
          <li>
            <a href="{{ '/' | relative_url }}#hobbies">Hobbies</a>
          </li>
        </ul>
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle
        aria-label="Change color appearance" title="Change color appearance">
        <span class="theme-icon" data-theme-icon aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>
