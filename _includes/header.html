<header class="site-header">
  <div class="shell header-inner">
    <a class="site-name" rel="author" href="{{ '/' | relative_url }}">
      {{ site.title | escape }}
    </a>

    <div class="header-actions">
      <nav aria-label="Primary navigation">
        <ul class="site-nav">
          <li>
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          </li>
          <li>
            <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications/' %} aria-current="page"{% endif %}>Publications</a>
          </li>
          <li>
            <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a>
          </li>
          <li>
            <a href="{{ '/hobbies/' | relative_url }}"{% if page.url contains '/hobbies/' %} aria-current="page"{% endif %}>Hobbies</a>
          </li>
        </ul>
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle
        aria-label="Change color appearance" title="Change color appearance">
        <span class="theme-icon" data-theme-icon aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>
