research_interests:
  - name: Causal inference
    description: >-
      Whether an action changes an outcome, not merely whether it predicts one:
      interventions, counterfactuals, and causal structure, including
      longitudinal settings where treatments, outcomes, and confounding evolve
      over time.
  - name: Uncertainty quantification
    description: >-
      How wrong a prediction can be, and the guarantees that make it safe to act
      on. Conformal prediction and distribution-free bounds for individualized
      treatment effects.
  - name: Explainability
    description: >-
      Why a model reached a prediction, and what a decision can be defended with.
      Attribution for predictions and for the uncertainty attached to them.
