research_interests:
  - name: Causal inference
    description: >-
      Clarifying the assumptions under which causal conclusions are justified,
      including in longitudinal settings with time-varying treatments and confounding.
  - name: Uncertainty quantification
    description: >-
      Characterizing uncertainty in causal estimates and predictions to inform
      decisions about action, deferral, or further information.
  - name: Explainability
    description: >-
      Attributing predictions and their uncertainty to features, with a focus on
      calibration- and instance-driven sources of conformal uncertainty.
